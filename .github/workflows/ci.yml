name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canopychain
          POSTGRES_PASSWORD: canopychain
          POSTGRES_DB: canopychain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://canopychain:canopychain@localhost:5432/canopychain_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Sync test database schema
        # db push, not migrate deploy: no migration files exist yet (no
        # local Postgres has been available to generate them from), and
        # db push is the officially recommended way to sync an ephemeral
        # test database directly from schema.prisma.
        run: npx prisma db push

      - name: Test
        run: npm test
