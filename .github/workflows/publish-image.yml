name: Publish image

# Builds the Dockerfile and pushes it to GHCR once CI has passed on main, so
# the backend can be deployed from a prebuilt image without the host needing
# access to this repository. When the RENDER_DEPLOY_HOOK secret is set, it
# also tells the Render service to deploy the new image.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/canopychain/canopychain-backend

jobs:
  publish:
    name: Build, push, deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run runs on main's latest commit, which may be newer than
          # the one CI just passed; build the commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tag
        id: tag
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render
        # Deploying the commit's tag, rather than re-pulling :latest, makes
        # each deploy name exactly what it runs.
        if: env.DEPLOY_HOOK != ''
        env:
          IMAGE_PATH: ${{ env.IMAGE }}:sha-${{ steps.tag.outputs.sha }}
        run: |
          img=$(jq -rn --arg v "$IMAGE_PATH" '$v|@uri')
          curl --fail-with-body --silent --show-error --request POST \
            "$DEPLOY_HOOK&imgURL=$img"
